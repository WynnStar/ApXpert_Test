<!doctype html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>確認刪除交易｜持股記帳 2.0</title>
</head>
<body>
<main th:with="holding=${target.holding}, entry=${target.entry}, trade=${entry.trade}, opening=${trade.side.name() == 'OPENING'}">
    <h1 th:text="|確認刪除 ${holding.code} ${holding.name ?: ''} 的交易|">確認刪除交易</h1>
    <p th:if="${deleteError}" th:text="${deleteError}" role="alert"></p>
    <dl>
        <dt>類型</dt><dd th:text="${opening ? '期初持股' : (trade.side.name() == 'BUY' ? '買進' : '賣出')}"></dd>
        <dt>交易日期</dt><dd th:text="${opening ? '由 1.0 帶入，無交易日期' : trade.tradeDate}"></dd>
        <dt>股數</dt><dd th:text="${trade.shares}"></dd>
        <dt>每股價格</dt><dd th:text="${trade.unitPrice}"></dd>
    </dl>
    <p th:if="${target.lastTrade}">
        這是最後一筆交易。繼續將刪除整檔持股，並移除所有交易和已實現損益紀錄。
    </p>
    <p th:if="${target.lastTrade and !target.v2Managed}">App 1.0 重新整理後，也會移除這檔持股。</p>
    <p th:unless="${target.lastTrade}">刪除後會重新計算股數、平均成本及損益。</p>
    <p>此操作無法復原。</p>
    <form th:action="@{/v2/holdings/{id}/trades/{tradeId}/delete(id=${holding.id},tradeId=${entry.id})}" method="post">
        <input type="hidden" name="lastTrade" th:value="${target.lastTrade}">
        <a th:href="@{/v2/holdings/{id}(id=${holding.id})}">取消</a>
        <button type="submit" th:text="${target.lastTrade ? '確認刪除整檔持股' : '確認刪除此筆交易'}"></button>
    </form>
</main>
</body>
</html>
